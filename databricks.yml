# This is a Declarative Automation Bundle definition for test.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: test
  uuid: 1f46797f-87cf-4a41-8662-d0064bd7cccd

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7585562856265540.0.azuredatabricks.net?w=7585562856265540
    variables:
      catalog: cat_ocloud_dv
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7585562856265540.0.azuredatabricks.net?w=7585562856265540
      # We explicitly deploy to /Workspace/Users/hector.vazquez01@gbsupport.net to make sure we only have a single copy.
      root_path: /Workspace/Users/hector.vazquez01@gbsupport.net/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: cat_ocloud_dv
      schema: prod
    permissions:
      - user_name: hector.vazquez01@gbsupport.net
        level: CAN_MANAGE
